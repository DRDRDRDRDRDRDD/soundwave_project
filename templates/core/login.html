{% extends 'base.html' %}
{% load static %}
{% block title %}SoundWave — Вход{% endblock %}

{% block content %}
<div class="form-page">
    <form id="loginForm" class="auth-form" method="post" novalidate>
        {% csrf_token %}
        <h1>Вход</h1>

        <div class="form-group">
            <label for="loginEmail">Email или логин</label>
            <input type="text" id="loginEmail" name="username" required>
            <span class="error" data-error="loginEmail"></span>
        </div>

        <div class="form-group">
            <label for="loginPassword">Пароль</label>
            <div class="password-wrap">
                <input type="password" id="loginPassword" name="password" required>
                <button type="button" class="toggle-pass" data-target="loginPassword">👁</button>
            </div>
            <span class="error" data-error="loginPassword"></span>
        </div>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <button type="submit" class="btn-primary">Войти</button>
        <p class="form-footer">Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a></p>
    </form>
</div>
{% endblock %}
