{% extends 'base.html' %}
{% load static %}
{% block title %}SoundWave — Каталог{% endblock %}

{% block content %}
<h1>Каталог альбомов</h1>
<div class="catalog-grid" id="catalogGrid">
    {% for album in albums %}
    <article class="album-card" data-title="{{ album.title }}">
        <a href="{% url 'album_detail' album.id %}">
            <img src="{% static 'images/images/' %}{{ album.cover }}" alt="{{ album.title }}">
        </a>
        <h3>{{ album.title }}</h3>
        <p>{{ album.artist }}</p>
    </article>
    {% empty %}
    <p>Альбомов пока нет.</p>
    {% endfor %}
</div>
{% endblock %}
